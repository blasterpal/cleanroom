services:
  dev:
    build: .
    command: ["sleep", "infinity"]
    init: true
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app:app_dev_only@db:5432/app_development
      TEST_DATABASE_URL: postgresql://app:app_dev_only@db:5432/app_test
      BRAVE_CDP_URL: ${BRAVE_CDP_URL:-http://host.docker.internal:9222}
      HERDR_BROWSER_CDP_URL: ${BRAVE_CDP_URL:-http://host.docker.internal:9222}
      TERM: xterm-256color
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${RAILS_HOST_PORT:-13000}:3000"
    volumes:
      - ./app:/workspace
      - ./spec:/spec:ro
      - ./data:/data
      - ./blind_data:/blind_data
      - ./data/opencode:/home/dev/.config/opencode
      - opencode-data:/home/dev/.local/share
      - opencode-state:/home/dev/.local/state
      - dev-cache:/home/dev/.cache
      - gems:/home/dev/bundle
      - herdr-config:/home/dev/.config/herdr
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_only
      POSTGRES_DB: app_development
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_development"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  opencode-data:
  opencode-state:
  dev-cache:
  gems:
  herdr-config:
